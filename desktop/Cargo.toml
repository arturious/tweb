[package]
name = "tg-desktop"
version = "0.1.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `unstable` enables several webviews inside one window,
# `macos-private-api` a transparent window for the Liquid Glass behind them
tauri = { version = "2.12", features = ["unstable", "macos-private-api"] }
tiny_http = "0.12"
tauri-plugin-notification = "2.7"
tauri-plugin-dialog = "2.8"
serde_json = "1"
semver = "1"

[features]
# The production build bundle.sh makes. Without it Tauri runs in dev mode, which also replaces
# the app's Dock icon at launch with icons/icon.png instead of the Liquid Glass icon in Assets.car
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
